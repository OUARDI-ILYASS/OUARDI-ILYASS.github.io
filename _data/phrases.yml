# Phrases, Quotes, and Poems to Live By
# Add entries here. They will automatically be displayed on /phrases-to-live-by in chronological order.
#
# Fields:
#   quote: The quote or poem (use `|` for multi-line poems/stanzas to preserve line breaks)
#   author: The person who said or wrote it
#   source: Optional: book title, speech, letter, or context
#   url: Optional link to source / reference
#   date: When you recorded or encountered it (YYYY-MM)
#   category: Optional tag (e.g., Perspective, Resilience, Poetry, Philosophy, Science)
#   is_poem: true/false (applies elegant serif stanza styling if true)
#   note: Optional personal reflection on what this means to you


- quote: |
    Tell the truth.
    Pay attention.
    Don't be too civilized.
    Be precise in your speech.
    Promote the best in people.
    Do not do things that you hate.
    Don't let bullies get away with it.
    Nothing well done is insignificant.
    Be grateful in spite of your suffering.
    Dress like the person you want to be.
    Maintain your connections with people.
    Do not hide unwanted things in the fog.
    Do not transform your wife into a maid.
    Speak the truth about unpleasant things.
    Be careful who you share bad news with.
    Be careful who you share good news with.
    Read something written by someone great.
    Stand up straight with your shoulders back.
    Pet a cat when you encounter one on the street.
    Pursue what is meaningful, not what is expedient.
    Reality isn’t made out of matter, but what matters. 
    Act so that you can tell the truth about how you act.
    Make friends with people who want the best for you.
    Do not bother children when they are skateboarding.
    Do not allow yourself to become arrogant or resentful.
    Make at least one thing better every single place you go.
    Don't avoid something frightening if it stands in your way.
    But also remember to not do unnecessarily dangerous things.
    Try to make one room in your house as beautiful as possible.
    Set your house in perfect order before you criticize the world.
    Don’t try to rescue someone who does not want to be rescued. 
    Be very careful of rescuing someone who wants to be rescued.
    Imagine who you could be, and then aim single mindedly at that.
    Do not let your children do anything that makes you dislike them.
    Notice that opportunity lurks where responsibility has been abdicated.
    Do not carelessly denigrate social institutions or artistic achievements.
    Plan and work diligently to maintain the romance in your relationships.
    Treat yourself as if you were someone that you are responsible for helping. 
    Work as hard as you possibly can on at least one thing and see what happens.
    If old memories still make you cry, write them down carefully and completely.
    Compare yourself to who you were yesterday, not to who someone else is today. 
    Remember that what you do not yet know is more important than what you already know. 
    Ask someone to do you a small favor so that he or she can ask you to do one in the future. 
    If you have to choose be the one who does things, instead of the one who is seen to do things.
    Write a letter to the government if you see something that needs fixing, and propose a solution.
    The person you are listening to might know something you need to know, listen so they will share it. 
    If you can't order your own life, you shouldn't be trying to order anything more complicated than that.
  author: "Dr. Jordan B. Peterson"
  source: "42 Rules for Life (Original Quora Post / Foundation for '12 Rules for Life')"
  date: "2026-10"
  category: "Life Advice"
  is_poem: false
  note: "A distillation of principles emphasizing radical personal responsibility, truth-telling, and the pursuit of meaning over expedience. True order begins with the self before attempting to restructure the world."

- quote: |
    "You should find out how the rest of the world is."
  author: "John C. Slater"
  source: "Advising Richard Feynman to leave MIT for Princeton (1939)"
  date: "2026-09"
  category: "Perspective"
  is_poem: false
  note: "A reminder not to linger in the comfort of what is already familiar, but to venture outwards and test your ideas against the broader world."

- quote: |
    "Il successo accademico come riscatto di classe è un peso troppo grande sulle spalle di bambini che non possono permettersi neanche le figurine."
  author: "@madonnafreeda"
  source: "Instagram post"
  date: "2026-09"
  category: "Roots"
  is_poem: false
  note: "Remembering where I came from, and consciously choosing to turn external pressure into an intrinsic, lifelong joy for research."

- quote: |
    "I would rather have questions that can't be answered than answers that can't be questioned."
  author: "Richard P. Feynman"
  source: "The Pleasure of Finding Things Out"
  date: "2026-09"
  category: "Curiosity"
  is_poem: false
  note: "The essence of the scientific mindset: embracing uncertainty and having the courage to challenge dogma."
