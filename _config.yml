site: Ilyass Ouardi
title: Ilyass Ouardi
description: "Research in Mechanistic Interpretability, Representation Geometry, and AI Safety"
url: "https://ouardi-ilyass.github.io"
baseurl: ""

twitter:
  username: ouardi_ilyass
  card: summary
  creator: ouardi_ilyass

author:
  name: "Ilyass Ouardi"
  avatar: "profile1.png"
  bio: "M.Sc. Computer Science Student at University of Milan. Researching mechanistic interpretability, representation geometry, and verifiable AI safety."
  permalink: pretty
  email: "ilyassouardi@gmail.com"
  github: "OUARDI-ILYASS"
  linkedin: "ilyass-ouardi"
  twitter: "ouardi_ilyass"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - .jekyll-cache
  
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir:          _sass
  style:            :compressed

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap  
  - jekyll-toc

toc:
  min_level: 1
  max_level: 3

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:year/:month/:day/:name
  projects:
    output: true
    permalink: /:year/:month/:day/:slug
  biographies:
    output: true
    permalink: /:collection/:name
  notes:
    output: true
    permalink: /:collection/:name
  
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
