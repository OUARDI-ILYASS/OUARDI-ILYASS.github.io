---
layout: default
title: Islam
---

{% include navigation.html %}
<div class="islam-container">
  <!-- Main content area -->
  <main class="islam-content">
    <h1>Islamic Articles</h1>
    {% for post in site.posts %}
      {% if post.content_type == "islam" %}
        <article class="islam-post" data-categories="{{ post.islam_category | downcase }}">
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Article",
            "headline": "{{ post.title | escape }}",
            "datePublished": "{{ post.date | date_to_xmlschema }}",
            "dateModified": "{{ post.last_modified_at | default: post.date | date_to_xmlschema }}",
            "author": {
              "@type": "Person",
              "name": "{{ site.author | default: 'Author Name' }}"
            },
            "publisher": {
              "@type": "Organization",
              "name": "{{ site.title | escape }}",
              "logo": {
                "@type": "ImageObject",
                "url": "{{ '/assets/images/profile1.png' | absolute_url }}"
              }
            },
            "description": "{{ post.excerpt | strip_html | truncate: 160 }}",
            "articleSection": "{{ post.islam_category }}",
            "mainEntityOfPage": {
              "@type": "WebPage",
              "@id": "{{ post.url | absolute_url }}"
            }
          }
          </script>
          <h2>{{ post.title }}</h2>
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time>
          <div class="post-content">
            {{ post.content }}
          </div>
        </article>
      {% endif %}
    {% endfor %}
  </main>
</div>
