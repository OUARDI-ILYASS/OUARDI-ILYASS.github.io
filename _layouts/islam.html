  <!-- Main content area -->
  <main class="islam-content">
    <h1>Islamic Articles</h1>
    {% for post in site.posts %}
      {% if post.content_type == "islam" %}
        <article class="islam-post" data-categories="{{ post.islam_category | downcase }}">
          <h2>{{ post.title }}</h2>
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %d, %Y" }}</time>
          <div class="post-content">
            {{ post.content }}
          </div>
        </article>
      {% endif %}
    {% endfor %}
  </main>
</div>
