---
layout: default
---

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "headline": "{{ page.title | escape }}",
  "description": "{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
}
</script>

{% include navigation.html %}
<section class="post {% if page.url == '/' or page.title == 'About Me' %}about-post{% endif %}">
  <h2>{{ page.title }}</h2>
  {{ content }}
</section>
