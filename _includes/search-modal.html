<div id="search-modal" class="search-modal-backdrop" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-modal-card">
    <div class="search-modal-header">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="modal-search-input" placeholder="Search research, articles, notes, pages..." autocomplete="off" spellcheck="false">
      <span class="search-kbd">ESC</span>
    </div>
    <div id="modal-search-results" class="search-modal-results">
      <div class="no-results">Type to search research, articles, notes...</div>
    </div>
    <div class="search-modal-footer">
      <span>Quick Navigation</span>
      <div class="keys">
        <span><kbd class="search-kbd">&uarr;&darr;</kbd> Navigate</span>
        <span><kbd class="search-kbd">&crarr;</kbd> Select</span>
        <span><kbd class="search-kbd">Esc</kbd> Close</span>
      </div>
    </div>
  </div>
</div>
